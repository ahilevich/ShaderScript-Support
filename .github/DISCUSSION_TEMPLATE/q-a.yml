labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you're trying to do, and what you've tried.
    validations:
      required: true

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Shader Script, Unity, and URP or HDRP.
      placeholder: "Shader Script 1.0.0, Unity 2022.3.62f3, URP 14.0.12"

  - type: textarea
    id: shader-code
    attributes:
      label: Shader code
      description: The relevant part of your shader, if any.
      render: csharp
